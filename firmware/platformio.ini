; =============================================================
; platformio.ini — Configuración del proyecto PlatformIO
; Proyecto: Sistema IoT para Cultivo de Hortalizas
; Plataforma: ESP32-WROOM-32
; Framework: Arduino
; IDE: Visual Studio Code + PlatformIO
; =============================================================

[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino

; --- Monitor serial ---
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder

; --- Opciones de compilación ---
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512    ; Ampliar buffer para payloads JSON grandes
    -D ARDUINO_ARCH_ESP32
    -Wall

; --- Librerías del proyecto ---
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8.0
    bblanchon/ArduinoJson @ ^6.21.5
    madhephaestus/ESP32Servo @ ^3.0.0

; --- Opciones de carga ---
upload_speed      = 921600

; --- Partición de memoria (para proyectos grandes) ---
board_build.partitions = min_spiffs.csv

; --- Nivel de depuración (0=sin debug, 5=máximo) ---
build_type        = debug
